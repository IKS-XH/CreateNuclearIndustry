plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientA {
            client()
            programArguments.addAll '--username', 'P0ProbeA'
            gameDirectory = project.file('run/client_a')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientB {
            client()
            programArguments.addAll '--username', 'P0ProbeB'
            gameDirectory = project.file('run/client_b')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // 默认仍运行模组原测试域；可用Gradle属性只启动隔离的定向测试域和目录。
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    providers.gradleProperty('gameTestNamespace').getOrElse(project.mod_id)
            if (providers.gradleProperty('gameTestDirectory').isPresent())
                gameDirectory = project.file(providers.gradleProperty('gameTestDirectory').get())
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.create_nuclear_industry
    }
}

// ModDevGradle's RunGameTask is a JavaExec task; forward the terminal input so
// the development server console can accept commands such as `op` and `stop`.
tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

configurations {
    developmentJei {
        canBeConsumed = false
        canBeResolved = true
    }
}

// JEI 仅进入客户端实际启动 classpath；放入 legacy 清单会被当作启动库，随后被模组发现去重跳过。
// 此独立配置不扩展通用 runtimeClasspath，避免影响服务端、测试或发布依赖。
['client', 'clientA', 'clientB'].each { runName ->
    tasks.named("run${runName.capitalize()}", JavaExec) {
        classpath(configurations.developmentJei)
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    developmentJei "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    doFirst {
        workingDir = project.projectDir
    }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '9.0.0'
    distributionType = Wrapper.DistributionType.BIN
    validateDistributionUrl = false
    networkTimeout = 60000
}

// 本批独立真实探针仅留开发运行classpath；发布包不携带其测试类和空模板，旧域保持。
tasks.named('jar', Jar) {
    exclude 'com/iksxh/create_nuclear_industry/gametest/RadiationFoundationGameTests*.class'
    exclude 'data/cni_radiation_foundation/structure/radiation_empty.nbt'
    exclude { entry -> entry.path.startsWith('data/cni_radiation_foundation') }
    exclude 'com/iksxh/create_nuclear_industry/gametest/ReactorPortLookupGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/ReactorAutomationGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/ReactorAutomationRetrofitGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/ReactorAdministratorGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/ReactorAdministratorResumeGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/ReactorLoadFollowGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/BoilerIndustrialActiveOutputGameTests*.class'
    exclude 'com/iksxh/create_nuclear_industry/gametest/BoilerSizeLimitGameTests*.class'
    exclude 'data/cni_reactor_automation/structure/automation_empty.nbt'
    exclude 'data/cni_reactor_automation_retrofit/structure/retrofit_empty.nbt'
    exclude 'data/cni_reactor_administrator/structure/administrator_empty.nbt'
    exclude 'data/cni_reactor_administrator_startup/structure/startup_empty.nbt'
    exclude 'data/cni_reactor_administrator_resume/structure/resume_empty.nbt'
    exclude 'data/cni_reactor_administrator_resume_review/structure/review_empty.nbt'
    exclude 'data/cni_reactor_load_follow/structure/load_follow_empty.nbt'
    exclude 'data/create_nuclear_industry_boiler_size/structure/boiler_size_empty.nbt'
}

// 贫化铀隔离探针仅供开发服务端；发布包排除测试类与模板。
tasks.withType(Jar).configureEach {
    exclude 'com/iksxh/create_nuclear_industry/gametest/AccidentExecutionGameTests*.class'
    exclude 'data/cni_accident_execution/**'
    exclude 'com/iksxh/create_nuclear_industry/gametest/DepletedUraniumGameTests*.class'
    exclude 'data/cni_depleted_uranium/**'
}
