#Create 整数锅炉热等级；18 等效 9 个超级燃烧室。
# Default: 18
# Range: 1 ~ 18
heatLevel = 18
#每个热等级每 tick 支付 HU。
# Default: 1.0
# Range: 1.0E-6 ~ 1000000.0
huPerLevel = 1.0
#预热储备及余热上限，单位 tick。
# Default: 40
# Range: 1 ~ 1200
bufferTicks = 40
#每台热液罐容量，单位 mB；下降时保留既存液量。
# Default: 4000
# Range: 1 ~ 1000000
hotCapacityMb = 4000
#每台冷液罐容量，单位 mB；下降时保留既存液量。
# Default: 4000
# Range: 1 ~ 1000000
coldCapacityMb = 4000
#水平直列最多允许的换热器台数，单位 台。
# Default: 16
# Range: 1 ~ 64
maxLineLength = 16
#每台最大冷凝输入量，单位 mB/t。
# Default: 54
# Range: 1 ~ 1000000
condensationRateMbPerTick = 54
#冷凝回水率，千分比；1000为1:1。
# Default: 1000
# Range: 1 ~ 1000
condensationRecoveryPermille = 1000
#每台蒸汽罐容量，单位mB；缩容保留存量。
# Default: 4000
# Range: 1 ~ 1000000
condensationSteamCapacityMb = 4000
#每台回水罐容量，单位mB；缩容保留存量。
# Default: 4000
# Range: 1 ~ 1000000
condensationWaterCapacityMb = 4000
#顶格雪块融化前实际处理蒸汽量，单位mB。
# Default: 100000
# Range: > 1
condensationSnowMeltAfterMb = 100000
#顶格冰融化前实际处理蒸汽量，单位mB。
# Default: 100000
# Range: > 1
condensationIceMeltAfterMb = 100000
#顶格浮冰融化前实际处理蒸汽量，单位mB。
# Default: 900000
# Range: > 1
condensationPackedIceMeltAfterMb = 900000
#顶格水源蒸发前实际处理蒸汽量，单位mB。
# Default: 100000
# Range: > 1
condensationWaterEvaporateAfterMb = 100000
