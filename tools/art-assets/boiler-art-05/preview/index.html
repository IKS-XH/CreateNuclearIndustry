<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高压锅炉素材候选</title><style>body{margin:0;background:#dddcd6;color:#263238;font:16px Segoe UI,Arial,sans-serif}header{padding:20px 28px;background:#293338;color:#f5f2e8}h1{margin:0 0 6px}main{max-width:1450px;margin:20px auto;padding:18px;background:#f8f7f2}section{margin:22px 0;padding-bottom:22px;border-bottom:1px solid #c3c4be}.sprites{display:flex;flex-wrap:wrap;gap:24px}.tile{display:grid;gap:8px;justify-items:center}.large{width:128px;height:128px;image-rendering:pixelated;background-color:#c4c8c6;background-image:linear-gradient(45deg,#aeb4b1 25%,transparent 25%),linear-gradient(-45deg,#aeb4b1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aeb4b1 75%),linear-gradient(-45deg,transparent 75%,#aeb4b1 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.atlas{width:256px;height:256px;image-rendering:pixelated;background:#c4c8c6}.scene{width:192px;height:auto;image-rendering:pixelated;background-color:#c4c8c6;background-image:linear-gradient(45deg,#aeb4b1 25%,transparent 25%),linear-gradient(-45deg,#aeb4b1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#aeb4b1 75%),linear-gradient(-45deg,transparent 75%,#aeb4b1 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.label{font-weight:600}small{color:#667176}img{object-fit:contain}</style><header><h1>高压锅炉 · A横箍压力舱素材候选</h1><div>SVG原创源稿与连接图集预览；尚未接入游戏</div></header><main><section><h2>基础纹理</h2><div class="sprites" id="base"></div></section><section><h2>连接图集</h2><div class="sprites" id="atlases"></div></section><section><h2>连窗边界形状</h2><div class="sprites" id="windows"></div><p><small>棋盘底色用于观察透明玻璃；示例使用原生八向邻接映射。</small></p></section><script>const base=['casing_side','casing_top','window_frame','water_port_face','steam_port_face','controller_face','exchanger_face','exchanger_top','valve_body','safety_badge','high_pressure_boiler_hot_coolant_port','high_pressure_boiler_cold_coolant_port'];const targets=['side','top','partition_side','water_port_face','steam_port_face','controller_face','hot_coolant_port','cold_coolant_port','window_frame'];function add(host,name,src,cls){let d=document.createElement('div');d.className='tile';let im=document.createElement('img');im.className=cls;im.src=src;d.appendChild(im);let label=document.createElement('span');label.className='label';label.textContent=name;d.appendChild(label);host.appendChild(d)}base.forEach(n=>add(document.getElementById('base'),n,'../generated/base_'+n+'.png','large'));targets.forEach(n=>add(document.getElementById('atlases'),n,'../generated/ct_'+n+'.png','atlas'));[['单窗','window_single.png'],['2×2连窗','window_2x2.png'],['L形缺角','window_L.png']].forEach(v=>add(document.getElementById('windows'),v[0],v[1],'scene'));</script></main></html>
