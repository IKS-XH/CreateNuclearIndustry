<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Create: Nuclear Industry — 齿轮与蓝色核芯</title>
  <desc>ART-LOGO-11原创像素徽标。钢灰齿轮、克制铜圈、四向钢制约束和蓝白核芯；透明底，无文字。</desc>
  <!-- 外轮廓采用两像素台阶与八个宽齿，缩至16像素时保留连续轮廓。 -->
  <rect x="8" y="6" width="16" height="20" fill="#26313A"/>
  <rect x="6" y="8" width="20" height="16" fill="#26313A"/>
  <rect x="12" y="2" width="8" height="6" fill="#26313A"/>
  <rect x="12" y="24" width="8" height="6" fill="#26313A"/>
  <rect x="2" y="12" width="6" height="8" fill="#26313A"/>
  <rect x="24" y="12" width="6" height="8" fill="#26313A"/>
  <rect x="4" y="4" width="6" height="6" fill="#26313A"/>
  <rect x="22" y="4" width="6" height="6" fill="#26313A"/>
  <rect x="4" y="22" width="6" height="6" fill="#26313A"/>
  <rect x="22" y="22" width="6" height="6" fill="#26313A"/>
  <!-- 钢制轮体由左上高光向右下暗面过渡，齿端保持两像素暗边。 -->
  <rect x="8" y="8" width="16" height="16" fill="#72828A"/>
  <rect x="10" y="6" width="12" height="2" fill="#B1BEC1"/>
  <rect x="6" y="10" width="2" height="12" fill="#B1BEC1"/>
  <rect x="10" y="24" width="12" height="2" fill="#465660"/>
  <rect x="24" y="10" width="2" height="12" fill="#465660"/>
  <rect x="14" y="4" width="4" height="2" fill="#B1BEC1"/>
  <rect x="14" y="6" width="4" height="2" fill="#72828A"/>
  <rect x="14" y="24" width="4" height="2" fill="#72828A"/>
  <rect x="14" y="26" width="4" height="2" fill="#465660"/>
  <rect x="4" y="14" width="2" height="4" fill="#B1BEC1"/>
  <rect x="6" y="14" width="2" height="4" fill="#72828A"/>
  <rect x="24" y="14" width="2" height="4" fill="#72828A"/>
  <rect x="26" y="14" width="2" height="4" fill="#465660"/>
  <rect x="6" y="6" width="4" height="2" fill="#B1BEC1"/>
  <rect x="6" y="8" width="2" height="2" fill="#72828A"/>
  <rect x="22" y="6" width="4" height="2" fill="#B1BEC1"/>
  <rect x="24" y="8" width="2" height="2" fill="#465660"/>
  <rect x="6" y="22" width="2" height="4" fill="#72828A"/>
  <rect x="8" y="24" width="2" height="2" fill="#465660"/>
  <rect x="22" y="24" width="4" height="2" fill="#465660"/>
  <rect x="24" y="22" width="2" height="2" fill="#72828A"/>
  <rect x="8" y="8" width="4" height="2" fill="#DDE8E8"/>
  <rect x="8" y="10" width="2" height="2" fill="#B1BEC1"/>
  <rect x="20" y="22" width="4" height="2" fill="#465660"/>
  <rect x="22" y="20" width="2" height="2" fill="#465660"/>
  <!-- 铜圈为两像素宽的阶梯环；四个钢卡爪跨过环面约束中央核芯。 -->
  <rect x="12" y="8" width="8" height="16" fill="#754832"/>
  <rect x="10" y="10" width="12" height="12" fill="#754832"/>
  <rect x="8" y="12" width="16" height="8" fill="#754832"/>
  <rect x="12" y="8" width="8" height="2" fill="#E4A56B"/>
  <rect x="10" y="10" width="2" height="2" fill="#E4A56B"/>
  <rect x="8" y="12" width="2" height="8" fill="#B87949"/>
  <rect x="10" y="20" width="2" height="2" fill="#B87949"/>
  <rect x="12" y="22" width="8" height="2" fill="#B87949"/>
  <rect x="20" y="10" width="2" height="2" fill="#B87949"/>
  <rect x="22" y="12" width="2" height="8" fill="#B87949"/>
  <rect x="20" y="20" width="2" height="2" fill="#754832"/>
  <rect x="12" y="10" width="8" height="12" fill="#26313A"/>
  <rect x="10" y="12" width="12" height="8" fill="#26313A"/>
  <!-- 核芯仅用连续蓝色块与白色高光，不使用细轨道或文字。 -->
  <rect x="14" y="10" width="4" height="12" fill="#12507C"/>
  <rect x="12" y="12" width="8" height="8" fill="#1489C1"/>
  <rect x="10" y="14" width="12" height="4" fill="#12507C"/>
  <rect x="12" y="14" width="8" height="4" fill="#1489C1"/>
  <rect x="14" y="12" width="4" height="6" fill="#6AD5EF"/>
  <rect x="12" y="14" width="4" height="2" fill="#6AD5EF"/>
  <rect x="14" y="14" width="4" height="2" fill="#D8FAFF"/>
  <rect x="16" y="18" width="4" height="2" fill="#12507C"/>
  <rect x="14" y="6" width="4" height="6" fill="#26313A"/>
  <rect x="14" y="6" width="4" height="2" fill="#DDE8E8"/>
  <rect x="14" y="8" width="4" height="2" fill="#B1BEC1"/>
  <rect x="14" y="10" width="4" height="2" fill="#465660"/>
  <rect x="14" y="20" width="4" height="6" fill="#26313A"/>
  <rect x="14" y="20" width="4" height="2" fill="#B1BEC1"/>
  <rect x="14" y="22" width="4" height="2" fill="#72828A"/>
  <rect x="14" y="24" width="4" height="2" fill="#465660"/>
  <rect x="6" y="14" width="6" height="4" fill="#26313A"/>
  <rect x="6" y="14" width="2" height="4" fill="#DDE8E8"/>
  <rect x="8" y="14" width="2" height="4" fill="#B1BEC1"/>
  <rect x="10" y="14" width="2" height="4" fill="#465660"/>
  <rect x="20" y="14" width="6" height="4" fill="#26313A"/>
  <rect x="20" y="14" width="2" height="4" fill="#B1BEC1"/>
  <rect x="22" y="14" width="2" height="4" fill="#72828A"/>
  <rect x="24" y="14" width="2" height="4" fill="#465660"/>
</svg>
