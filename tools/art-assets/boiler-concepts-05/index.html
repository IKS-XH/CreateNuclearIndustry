<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>锅炉连接外观设计稿</title><style>body{margin:0;background:#e6e5df;color:#253036;font:15px Segoe UI,Arial,sans-serif}header{padding:14px 24px;background:#263238;color:#f7f4eb}header h1{margin:0 0 4px;font-size:22px}header p{margin:0;color:#d4dedc}.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:10px 22px}.tabs button{border:1px solid #7d8889;background:#faf9f5;padding:9px 15px;border-radius:4px;font-weight:700;cursor:pointer}.tabs button.active{background:#53666c;color:white}main{margin:0 18px 18px;background:#faf9f5;border:1px solid #c4c5bf;line-height:0}object{display:block;width:100%;height:calc(100vh - 125px);min-height:760px;object-fit:contain;object-position:top center}</style><header><h1>锅炉连接外观提案</h1><p>三套SVG设计稿 · 设计稿，未接入游戏</p></header><nav class="tabs"><button class="active" data-src="connected/overview.svg">连接外观</button><button data-src="connected/A/board.svg">A 横箍压力舱</button><button data-src="connected/B/board.svg">B 耐火砖护套</button><button data-src="connected/C/board.svg">C 钢骨架舱</button><button data-src="overview.svg">原单块稿</button><button data-src="01-horizontal-hoop/board.svg">原稿 A</button><button data-src="02-refractory-jacket/board.svg">原稿 B</button><button data-src="03-steel-frame/board.svg">原稿 C</button></nav><main><object id="board" data="connected/overview.svg" type="image/svg+xml" aria-label="锅炉连接外观设计稿"></object></main><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('board').data=b.dataset.src;}));</script></html>
